spring:
    sql:
        init:
            mode: never
    jpa:
        hibernate:
            ddl-auto: validate
        database-platform: org.hibernate.dialect.MySQLDialect
        show-sql: false
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: ${DB_DRIVER}
    flyway:
        enabled: true
        locations: classpath:db/migration/prod
        baseline-on-migrate: true